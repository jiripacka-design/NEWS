<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Competitor Intelligence</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f4f6fa;color:#182230}header{background:#071b4d;color:white;padding:24px 4%}main{max-width:1180px;margin:auto;padding:24px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,a.btn{padding:10px;border:1px solid #bcc6d4;border-radius:7px;background:white}.btn{background:#0639bd!important;color:white;text-decoration:none}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:12px 0}.meta{color:#667085;font-size:12px}.validation{border-left:5px solid #f79009}.empty{padding:40px;text-align:center}</style></head><body><header><h1>Competitor Intelligence</h1><div id=health>News scanner not yet run</div></header><main><div class=tools><input id=q placeholder="Search articles"><select id=brand><option value="">All brands</option></select><label><input id=showtest type=checkbox> Show validation content</label><a class=btn href="/admin">Manage news sources</a></div><div id=list class=empty>Loading news...</div></main><script>let articles=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let t=q.value.toLowerCase(),b=brand.value,v=articles.filter(x=>(showtest.checked||!x.validation)&&(!b||x.brand===b)&&(!t||(x.title+' '+x.summary+' '+x.brand).toLowerCase().includes(t)));list.className=v.length?'':'empty';list.innerHTML=v.map(x=>`<article class="card ${x.validation?'validation':''}"><div class=meta>${x.validation?'VALIDATION · ':''}${esc(x.brand)} · ${new Date(x.published||x.discoveredAt).toLocaleString()}</div><h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2><p>${esc(x.summary)}</p><div class=meta>${esc(x.sourceName||x.source)}</div></article>`).join('')||'No matching articles. Run a scan from Manage news sources.'}async function load(){let [n,s]=await Promise.all([fetch('/api/news').then(r=>r.json()),fetch('/api/status').then(r=>r.json())]);articles=n.articles||[];let bs=[...new Set(articles.map(x=>x.brand))].sort();brand.innerHTML='<option value="">All brands</option>'+bs.map(x=>`<option>${esc(x)}</option>`).join('');health.textContent=s.status?`Last scan ${new Date(s.status.completedAt).toLocaleString()} · ${s.status.newArticles} new · ${s.status.status}`:'News scanner not yet run';render()}q.oninput=brand.onchange=showtest.onchange=render;load()</script><a href='/admin' style='position:fixed;right:16px;bottom:16px;z-index:99999;background:#0639bd;color:white;padding:10px 14px;border-radius:8px;text-decoration:none;font-family:Segoe UI,Arial'>Manage news sources</a></body></html>

<!doctype html><meta name=viewport content='width=device-width'><title>Sign in</title><style>:root{color-scheme:dark}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;background:#000;color:#f5f5f7;display:grid;place-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}.b{width:min(380px,85vw)}h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}p.s{margin:0 0 28px;color:#8e8e93}input,button{width:100%;box-sizing:border-box;padding:13px 14px;margin-top:12px;font:inherit;border-radius:10px}input{background:#0d0d0e;color:#f5f5f7;border:1px solid #262628}input:focus{outline:2px solid #3b8ae6;outline-offset:1px}button{background:#f5f5f7;color:#000;border:0;border-radius:999px;font-weight:600;cursor:pointer}#e{color:#ff7a6b;min-height:1.2em;margin:12px 0 0}</style><form class=b id=f><h1>Brompton Enemies</h1><p class=s>Sign in to view the tracker. Your name is shown next to the changes you make.</p><input id=n placeholder="Your name" autocomplete=username maxlength=40 autofocus><input id=p type=password placeholder=Password required autocomplete=current-password><button>Sign in</button><p id=e></p></form><script>f.onsubmit=async x=>{x.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n.value,password:p.value})});if(r.ok){try{localStorage.setItem('cih_name',n.value)}catch(_){}location='/tracker'}else e.textContent=personal?'Incorrect name or password':'Incorrect password'};let personal=false;try{n.value=localStorage.getItem('cih_name')||'';if(n.value)p.focus()}catch(_){}fetch('/api/login').then(r=>r.json()).then(d=>{personal=d.personal;n.required=personal;n.placeholder=personal?'Your name':'Your name (shown on your changes)'}).catch(()=>{})</script>

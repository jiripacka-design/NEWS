<!doctype html><meta name=viewport content='width=device-width'><title>Sign in</title><style>body{font-family:Segoe UI,Arial;background:#f3f6fb;display:grid;place-items:center;min-height:100vh}.b{background:white;padding:30px;border-radius:16px;width:min(380px,85vw);box-shadow:0 12px 40px #1232}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:12px}button{background:#0639bd;color:white;border:0;border-radius:8px}</style><form class=b id=f><h1>Competitor Intelligence</h1><input id=p type=password placeholder=Password required><button>Sign in</button><p id=e></p></form><script>f.onsubmit=async x=>{x.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location='/tracker';else e.textContent='Incorrect password'}</script>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Competitor Intelligence - Sign in</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f3f6fb;color:#172033;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 12px 40px #102a561f;width:min(390px,calc(100% - 32px))}h1{font-size:24px;margin:0 0 8px}.sub{color:#667085;margin-bottom:22px}label{display:block;font-weight:650;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:#0639bd;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.err{color:#b42318;min-height:20px;margin-top:10px;font-size:13px}</style></head><body><form class="box" id="f"><h1>Competitor Intelligence</h1><div class="sub">Enter the shared password to continue.</div><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required><button>Access tracker</button><div class="err" id="e" aria-live="polite"></div></form><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),err=document.getElementById('e');b.disabled=true;err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});if(!r.ok)throw new Error('Incorrect password');location.href='/'}catch(x){err.textContent=x.message;b.disabled=false}})</script></body></html>

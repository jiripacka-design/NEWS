<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>News source manager</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f4f6fa;color:#182230}header{background:#071b4d;color:white;padding:20px 4%}main{max-width:1180px;margin:auto;padding:24px}.bar,.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,button{padding:10px;border:1px solid #bcc6d4;border-radius:7px}button{cursor:pointer}.primary{background:#0639bd;color:white;border:0}.danger{color:#b42318}.source{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.ok{color:#067647}.bad{color:#b42318}@media(max-width:700px){.source{grid-template-columns:1fr}}</style></head><body><div style="position:fixed;top:10px;left:10px;z-index:99999;background:#fff;color:#071b4d;border:1px solid #cbd5e1;border-radius:999px;padding:5px 9px;font:600 12px Segoe UI,Arial;box-shadow:0 2px 8px #0002" title="Current deployed application version">v3.0.2</div><header><h1>News source manager</h1><div><a href="/tracker" style="color:white">Back to tracker</a></div></header><main><section class=bar><div class=grid><div><b>Scanner status</b><div id=status>Loading...</div></div><div><b>Last scan</b><div id=last>–</div></div><div><b>New articles</b><div id=news>–</div></div><button type=button class=primary id=scan>Rescan news now</button></div><pre id=result></pre></section><section class=card><h2>Add or edit source</h2><div id=saveStatus style="margin-bottom:10px"></div><form id=form class=grid action="javascript:void(0)" novalidate><input id=sid type=hidden><input id=name placeholder="Source name" required><select id=type><option value=rss>RSS / Atom</option><option value=google-news>Google News query</option><option value=test>Validation feed</option></select><input id=url placeholder="HTTPS RSS URL"><input id=query placeholder="Google News query"><input id=brand placeholder="Brand / category"><select id=filter><option value=bike>Bicycle relevance filter</option><option value=all>Include all items</option></select><label><input id=enabled type=checkbox checked> Enabled</label><label><input id=validation type=checkbox> Validation source</label><button type=submit class=primary>Save source</button></form></section><section class=card><h2>Sources</h2><div id=sources></div></section><section class=card><h2>Validation feed</h2><form id=testform class=grid action="javascript:void(0)"><input id=testtitle placeholder="Unique validation article title" required><input id=testsummary placeholder="Summary"><button type=submit class=primary>Add test article</button></form><div id=tests></div></section><section class=card><h2>Recent scan history</h2><div id=history></div></section></main><script>const $=x=>document.getElementById(x);let all=[];const call=async(u,o)=>{let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let [s,st,t]=await Promise.all([call('/api/sources'),call('/api/status'),call('/api/test-items')]);all=s.sources;$('sources').innerHTML=all.map(x=>`<div class=source><div><b>${esc(x.name)}</b><br><small>${esc(x.url||x.query||x.type)}</small></div><div>${esc(x.brand)}</div><div class=${x.lastError?'bad':'ok'}>${x.enabled?(x.lastError?'Failing':'Enabled'):'Disabled'}<br><small>${esc(x.lastError||x.lastSuccessAt||'Not scanned')}</small></div><div><button onclick="edit('${x.id}')">Edit</button> <button class=danger onclick="delSource('${x.id}')">Delete</button></div></div>`).join('');let a=st.status;$('status').textContent=a?a.status:'Not scanned';$('last').textContent=a?new Date(a.completedAt).toLocaleString():'–';$('news').textContent=a?a.newArticles:'–';$('history').innerHTML=st.history.slice(0,20).map(x=>`<p><b>${new Date(x.completedAt).toLocaleString()}</b> · ${esc(x.trigger)} · ${x.newArticles} new · ${x.sourcesSuccessful}/${x.sourcesChecked} sources · ${esc(x.status)}</p>`).join('')||'No scans yet';$('tests').innerHTML=t.items.map(x=>`<p>${esc(x.title)} <button class=danger onclick="delTest('${x.id}')">Delete</button></p>`).join('')||'No validation items yet'}function edit(id){let x=all.find(y=>y.id===id);for(let k of ['name','type','url','query','brand'])$(k).value=x[k]||'';$('sid').value=x.id;$('filter').value=x.filterMode||'bike';$('enabled').checked=x.enabled;$('validation').checked=x.validation;scrollTo(0,0)}async function delSource(id){if(confirm('Delete this source?')){await call('/api/sources?id='+id,{method:'DELETE'});load()}}async function delTest(id){await call('/api/test-items?id='+id,{method:'DELETE'});load()}$('form').onsubmit=async e=>{e.preventDefault();await call('/api/sources',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:sid.value||undefined,name:name.value,type:type.value,url:url.value,query:query.value,brand:brand.value,filterMode:filter.value,enabled:enabled.checked,validation:validation.checked})});e.target.reset();enabled.checked=true;load()};$('testform').onsubmit=async e=>{e.preventDefault();await call('/api/test-items',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:testtitle.value,summary:testsummary.value})});e.target.reset();load()};$('downloadlog').onclick=async()=>{try{let r=await fetch('/api/logs',{headers:h()});if(!r.ok)throw new Error(await r.text());let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='competitor-tracker-scan.log';a.click();URL.revokeObjectURL(u)}catch(e){result.textContent=e.message}};$('scan').onclick=async()=>{scan.disabled=true;result.textContent='Scanning...';try{let r=await call('/api/rescan',{method:'POST'});result.textContent=JSON.stringify(r,null,2)}catch(e){result.textContent=e.message}scan.disabled=false;load()};load().catch(e=>status.textContent=e.message)</script></body></html>
